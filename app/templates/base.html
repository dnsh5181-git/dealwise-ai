<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}DealWise AI{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="logo">◆</span> DealWise <span class="ai">AI</span>
    </a>
    <nav>
      <a href="/">Search</a>
      <a href="/assistant">Assistant</a>
      <a href="/alerts">Alerts</a>
      <a href="/docs">API</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <span>DealWise AI — Shopping Intelligence Platform · MVP</span>
    <span class="muted">Deal Score &amp; Buy-Now are computed from real price history, not an LLM.</span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
