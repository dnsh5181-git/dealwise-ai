[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sorting, UP pyupgrade, B bugbear.
select = ["E", "W", "F", "I", "UP", "B"]
# Long lines (mostly SQL strings and docstrings) are not worth wrapping here.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
